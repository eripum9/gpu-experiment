name: macOS compile check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesa-native-compile:
    name: Mesa patch tests and x86_64 RADV compile
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Prepare Mesa build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/mesa-python"
          "$RUNNER_TEMP/mesa-python/bin/python" -m pip install --disable-pip-version-check meson==1.9.1 ninja==1.13.0 Mako==1.3.10 MarkupSafe==3.0.2 packaging==25.0 PyYAML==6.0.2
          brew install glslang

      - name: Apply pinned Mesa patches, test native transport, and compile RADV
        run: |
          export PATH="$RUNNER_TEMP/mesa-python/bin:$PATH"
          python tools/ci/check_mesa_patches.py --build-radv

      - name: Upload compile-only RADV artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesa-radv-compile-check-Navi44-disabled
          path: build/mesa-radv-compile-check
          if-no-files-found: error
          retention-days: 7

  macos-compile:
    name: Host tests and x86_64 kext compile
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run offline host tests
        run: python3 tools/gpu-inspect/build.py all

      - name: Test standalone Navi 44 survey and collector
        run: |
          python3 tools/navi44-survey/build.py
          python3 -m unittest discover -s tools/navi44-survey -p 'test_*.py' -v

      - name: Test Linux hardware collector with synthetic sysfs
        run: python3 -m unittest discover -s tools/gpu-inspect -p 'test_*.py' -v

      - name: Fetch pinned compile dependencies
        run: python3 tools/ci/fetch_deps.py

      - name: Validate both pinned PSP firmware containers
        run: |
          build/gpu-inspect/psp-container-test \
            src/navi48-bringup/firmware/psp_14_0_2_sos.bin \
            src/navi48-bringup/firmware/psp_14_0_3_sos.bin
          build/gpu-inspect/psp-adapter-test \
            src/navi48-bringup/firmware/psp_14_0_2_sos.bin \
            src/navi48-bringup/firmware/psp_14_0_3_sos.bin

      - name: Compile x86_64 bring-up kext
        run: make -C src/navi48-bringup MKSDK="$GITHUB_WORKSPACE/build/ci-deps/MacKernelSDK" all

      - name: Compile standalone x86_64 Navi 44 survey
        run: make -C src/navi44-survey MKSDK="$GITHUB_WORKSPACE/build/ci-deps/MacKernelSDK" all

      - name: Package compile-only artifacts
        run: python3 tools/ci/package_compile_artifact.py --output "$RUNNER_TEMP/Navi48Bringup-compile-check.tar.gz"

      - name: Package standalone survey hardware-test candidate
        run: python3 tools/ci/package_survey_artifact.py --output "$RUNNER_TEMP/CobaltNavi44Survey-hardware-test.tar.gz"

      - name: Upload standalone survey hardware-test candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CobaltNavi44Survey-hardware-test
          path: ${{ runner.temp }}/CobaltNavi44Survey-hardware-test.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload offline inspector binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-inspector-macos-x86_64
          path: |
            build/gpu-inspect/gpu-inspect
            build/gpu-inspect/gpu-profile-test
            build/gpu-inspect/ipdiscovery-test
            build/gpu-inspect/fw-profile-test
            build/gpu-inspect/gfx-topology-test
            build/gpu-inspect/smu-protocol-test
            build/gpu-inspect/smu-transport-test
            build/gpu-inspect/gpu-info-test
            build/gpu-inspect/gpu-info-c-test
            build/gpu-inspect/gfx-runtime-test
            build/gpu-inspect/gfx-runtime-c-test
            build/gpu-inspect/cp-firmware-test
            build/gpu-inspect/cp-firmware-c-test
            build/gpu-inspect/psp-container-test
            build/gpu-inspect/psp-adapter-test
          if-no-files-found: error
          retention-days: 7

      - name: Upload compile-only kext artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Navi48Bringup-compile-check-Navi44-disabled
          path: ${{ runner.temp }}/Navi48Bringup-compile-check.tar.gz
          if-no-files-found: error
          retention-days: 7
